[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voybit-payment-gateway-django"
version = "0.1.0"
description = "Django integration for the Voybit crypto payment gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "django>=4.2",
  "voybit-payment-gateway @ git+https://github.com/VOYBIT/voybit-payment-gateway-python.git",
]

[tool.setuptools.packages.find]
where = ["src"]
